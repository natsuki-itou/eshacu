name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Spring Boot tests
        run: |
          cd eshacu-backend
          chmod +x mvnw
          ./mvnw -B test

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      

      # Node & pnpm
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8 # ← lockfileと合わせて変更

      - name: Install dependencies
        run: |
          cd eshacu-frontend
          pnpm install --frozen-lockfile

      - name: Run ESLint
        run: |
          cd eshacu-frontend
          pnpm lint
