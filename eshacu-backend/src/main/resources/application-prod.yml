spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eshacu}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: validate   # 本番はDDL変更禁止、Flywayで管理
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  api-docs:
    enabled: false   # 原則OFF
  swagger-ui:
    enabled: false   # 原則OFF
  # paths-to-match: /api/**

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

# Heroku / Cloud 環境に合わせて調整可
server:
  forward-headers-strategy: framework
