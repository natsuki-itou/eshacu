spring:
  datasource:
    url: jdbc:h2:mem:eshacu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update         # ← テーブル自動作成
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true  # ← data.sql を「DDLの後」に実行
  sql:
    init:
      mode: always             # ← data.sql を有効化
  h2:
    console:
      enabled: true

cors:
  allowed-origins:
    - http://localhost:3000
  allowed-methods: [GET, POST, HEAD, PUT, PATCH, DELETE, OPTIONS]
  allowed-headers: ["*"]
  allow-credentials: true
  max-age: 3600
  path-patterns: ["/api/**"]

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  paths-to-match: /api/**

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    dev.eshacu.controller.advice: INFO

